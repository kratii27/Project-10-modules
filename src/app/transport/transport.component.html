<style type="text/css">
.input-group-addon {
  box-shadow: 9px 8px 7px #001a33;
}

.hm {
  background-image: url('assets/files/add.png');
  background-repeat: no-repeat;
  background-attachment: fixed;
  background-size: cover;
  padding-top: 75px;
}
</style>

<div class="hm">
  <main>
    <div class="row pt-3">

      <div class="col-md-4 mb-4"></div>

      <div class="col-md-4 mb-4">
        <div class="card input-group-addon">
          <div class="card-body">

            <h3 *ngIf="!form.data.id" class="text-center default-text text-dark">Add Transport</h3>
            <h3 *ngIf="form.data.id > 0" class="text-center default-text text-dark">Update Transport</h3>

            <div>
              <H4 align="center">
                <div *ngIf="!form.error && form.message" class="alert alert-success alert-dismissible">
                  <button type="button" class="close" data-dismiss="alert">&times;</button>
                  {{ form.message }}
                </div>
              </H4>
              <H4 align="center">
                <div *ngIf="form.error && form.message" class="alert alert-danger alert-dismissible">
                  <button type="button" class="close" data-dismiss="alert">&times;</button>
                  {{ form.message }}
                </div>
              </H4>
            </div>

            <div class="md-form">

              <!-- Vehicle Type -->
              <span class="pl-sm-5"><b>Vehicle Type</b> <span style="color: red;">*</span></span><br>
              <div class="col-sm-12">
                <div class="input-group">
                  <div class="input-group-prepend">
                    <div class="input-group-text"><i class="fa fa-truck grey-text" style="font-size: 1rem;"></i></div>
                  </div>
                  <input type="text" class="form-control" name="vehicleType" [(ngModel)]="form.data.vehicleType" placeholder="Enter Vehicle Type">
                </div>
              </div>
              <font color="red" class="pl-sm-5">{{ form.inputerror.vehicleType }}</font><br>

              <!-- Driver Name -->
              <span class="pl-sm-5"><b>Driver Name</b> <span style="color: red;">*</span></span><br>
              <div class="col-sm-12">
                <div class="input-group">
                  <div class="input-group-prepend">
                    <div class="input-group-text"><i class="fa fa-user grey-text" style="font-size: 1rem;"></i></div>
                  </div>
                  <input type="text" class="form-control" name="driverName" [(ngModel)]="form.data.driverName" placeholder="Enter Driver Name">
                </div>
              </div>
              <font color="red" class="pl-sm-5">{{ form.inputerror.driverName }}</font><br>

              <!-- Charges -->
              <span class="pl-sm-5"><b>Charges</b> <span style="color: red;">*</span></span><br>
              <div class="col-sm-12">
                <div class="input-group">
                  <div class="input-group-prepend">
                    <div class="input-group-text"><i class="fa fa-money grey-text" style="font-size: 1rem;"></i></div>
                  </div>
                  <input type="number" class="form-control" name="charges" [(ngModel)]="form.data.charges" placeholder="Enter Charges">
                </div>
              </div>
              <font color="red" class="pl-sm-5">{{ form.inputerror.charges }}</font><br>

              <!-- Buttons -->
              <div *ngIf="!form.data.id" class="text-center">
                <input type="submit" (click)="submit()" class="btn btn-success btn-md" style="font-size: 17px" value="Save">&nbsp;
                <input type="submit" (click)="reset()" class="btn btn-warning btn-md" style="font-size: 17px" value="Reset">
              </div>
              <div *ngIf="form.data.id > 0" class="text-center">
                <input type="submit" (click)="submit()" class="btn btn-success btn-md" style="font-size: 17px" value="Update">&nbsp;
                <input type="submit" (click)="forward('/transportlist')" class="btn btn-warning btn-md" style="font-size: 17px" value="List">
              </div>

            </div>
          </div>
        </div>
      </div>

      <div class="col-md-4 mb-4"></div>

    </div>
  </main>
</div>

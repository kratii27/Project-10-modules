<style type="text/css">
.input-group-addon {
  box-shadow: 9px 8px 7px #001a33;
}

.hm {
  background-image: url('assets/files/add.png');
  background-repeat: no-repeat;
  background-attachment: fixed;
  background-size: cover;
  padding-top: 75px;
}
</style>

<div class="hm">
  <main>
    <div class="row pt-3">

      <div class="col-md-4 mb-4"></div>

      <div class="col-md-4 mb-4">
        <div class="card input-group-addon">
          <div class="card-body">

            <h3 *ngIf="!form.data.id" class="text-center default-text text-dark">Add Rating</h3>
            <h3 *ngIf="form.data.id > 0" class="text-center default-text text-dark">Update Rating</h3>

            <div>
              <H4 align="center">
                <div *ngIf="!form.error && form.message" class="alert alert-success alert-dismissible">
                  <button type="button" class="close" data-dismiss="alert">&times;</button>
                  {{ form.message }}
                </div>
              </H4>
              <H4 align="center">
                <div *ngIf="form.error && form.message" class="alert alert-danger alert-dismissible">
                  <button type="button" class="close" data-dismiss="alert">&times;</button>
                  {{ form.message }}
                </div>
              </H4>
            </div>

            <div class="md-form">

              <!-- Rating Code -->
              <span class="pl-sm-5"><b>Rating Code</b> <span style="color: red;">*</span></span><br>
              <div class="col-sm-12">
                <div class="input-group">
                  <div class="input-group-prepend">
                    <div class="input-group-text"><i class="fa fa-barcode grey-text" style="font-size: 1rem;"></i></div>
                  </div>
                  <input type="text" class="form-control" name="ratingCode" [(ngModel)]="form.data.ratingCode" placeholder="Enter Rating Code">
                </div>
              </div>
              <font color="red" class="pl-sm-5">{{ form.inputerror.ratingCode }}</font><br>

              <!-- User Name -->
              <span class="pl-sm-5"><b>User Name</b> <span style="color: red;">*</span></span><br>
              <div class="col-sm-12">
                <div class="input-group">
                  <div class="input-group-prepend">
                    <div class="input-group-text"><i class="fa fa-user grey-text" style="font-size: 1rem;"></i></div>
                  </div>
                  <input type="text" class="form-control" name="userName" [(ngModel)]="form.data.userName" placeholder="Enter User Name">
                </div>
              </div>
              <font color="red" class="pl-sm-5">{{ form.inputerror.userName }}</font><br>

              <!-- Rating Value -->
              <span class="pl-sm-5"><b>Rating Value</b> <span style="color: red;">*</span></span><br>
              <div class="col-sm-12">
                <div class="input-group">
                  <div class="input-group-prepend">
                    <div class="input-group-text"><i class="fa fa-star grey-text" style="font-size: 1rem;"></i></div>
                  </div>
                  <input type="number" class="form-control" name="ratingValue" [(ngModel)]="form.data.ratingValue" placeholder="Enter Rating Value">
                </div>
              </div>
              <font color="red" class="pl-sm-5">{{ form.inputerror.ratingValue }}</font><br>

              <!-- Status -->
              <span class="pl-sm-5"><b>Status</b> <span style="color: red;">*</span></span><br>
              <div class="col-sm-12">
                <div class="input-group">
                  <div class="input-group-prepend">
                    <div class="input-group-text"><i class="fa fa-toggle-on grey-text" style="font-size: 1rem;"></i></div>
                  </div>
                  <select name="status" [(ngModel)]="form.data.status" class="form-control">
                    <option value="undefined">------------Select------------</option>
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                  </select>
                </div>
              </div>
              <font color="red" class="pl-sm-5">{{ form.inputerror.status }}</font><br>

              <!-- Buttons -->
              <div *ngIf="!form.data.id" class="text-center">
                <input type="submit" (click)="submit()" class="btn btn-success btn-md" style="font-size: 17px" value="Save">&nbsp;
                <input type="submit" (click)="reset()" class="btn btn-warning btn-md" style="font-size: 17px" value="Reset">
              </div>
              <div *ngIf="form.data.id > 0" class="text-center">
                <input type="submit" (click)="submit()" class="btn btn-success btn-md" style="font-size: 17px" value="Update">&nbsp;
                <input type="submit" (click)="forward('/ratinglist')" class="btn btn-warning btn-md" style="font-size: 17px" value="List">
              </div>

            </div>
          </div>
        </div>
      </div>

      <div class="col-md-4 mb-4"></div>

    </div>
  </main>
</div>
